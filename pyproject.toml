[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "load"
version = "0.1.0"
description = "Local Causal Discovery for Statistically Efficient Causal Inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/load"]
